{{- if and .Values.lobehubGateway.enabled (not .Values.lobehubGateway.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lobehub.gateway.fullname" . }}
  labels:
    {{- include "lobehub.gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  SERVICE_TOKEN: {{ required "lobehubGateway.secrets.serviceToken (or lobehubGateway.secrets.existingSecret) is required when lobehubGateway.enabled=true" .Values.lobehubGateway.secrets.serviceToken | quote }}
  {{- if .Values.lobehubGateway.secrets.jwksPublicKey }}
  JWKS_PUBLIC_KEY: {{ .Values.lobehubGateway.secrets.jwksPublicKey | quote }}
  {{- end }}
{{- end }}
