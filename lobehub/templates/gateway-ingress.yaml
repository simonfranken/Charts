{{- if and .Values.lobehubGateway.enabled .Values.lobehubGateway.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lobehub.gateway.fullname" . }}
  labels:
    {{- include "lobehub.gateway.labels" . | nindent 4 }}
  {{- with .Values.lobehubGateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.lobehubGateway.ingress.className }}
  ingressClassName: {{ .Values.lobehubGateway.ingress.className }}
  {{- end }}
  {{- if .Values.lobehubGateway.ingress.tls }}
  tls:
    {{- toYaml .Values.lobehubGateway.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.lobehubGateway.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "lobehub.gateway.fullname" $ }}
                port:
                  name: device
          {{- end }}
    {{- end }}
{{- end }}
